# Проект генерируется xcodegen (`xcodegen generate`) — .xcodeproj в git не хранится.
# Версия и код сборки идут той же линией, что и Android (0.38.19 / 75).
name: ElectroRemote
options:
  bundleIdPrefix: uz.electro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.38.19"
    CURRENT_PROJECT_VERSION: "75"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ElectroRemote:
    type: application
    platform: iOS
    sources:
      - path: ElectroRemote
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.electro.remote
        PRODUCT_NAME: LeapRemote
        INFOPLIST_FILE: ElectroRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Подпись задаётся снаружи (CI/Xcode): без Apple Developer собираем неподписанный архив.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
